name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DELIVERY_HELPER_REVISION: f580be8705678234fd4b1abdcf9e56860f43b33f
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            arch: aarch64
          - target: macos-x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
            arch: x86_64
          - target: macos-aarch64
            runner: macos-15
            host: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_HOST: ${{ matrix.host }}
      EXPECTED_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-world
          ref: ${{ env.DELIVERY_HELPER_REVISION }}
          path: target/ci/control-plane
          sparse-checkout: scripts/native_delivery.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: OpenGene/fastp
          ref: 23d6211d4f05d61f561899f1b7702435a4b5d408
          path: target/ci/fastp
          persist-credentials: false
      - uses: actions/checkout@v6
        if: startsWith(matrix.runner, 'ubuntu')
        with:
          repository: google/highway
          ref: ac0d5d297b13ab1b89f48484fc7911082d76a93f
          path: target/ci/highway
          persist-credentials: false

      - name: Prepare runner storage
        run: |
          set -euo pipefail
          for entry in CARGO_HOME=cargo-home CARGO_TARGET_DIR=cargo-target RUSTUP_HOME=rustup-home TMPDIR=scratch XDG_CACHE_HOME=cache; do
            directory="$RUNNER_TEMP/${entry#*=}"
            mkdir -p "$directory"
            printf '%s=%s\n' "${entry%%=*}" "$directory" >> "$GITHUB_ENV"
          done
          mkdir -p "$RUNNER_TEMP/delivery"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - name: Verify native host and resolved Cargo target
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          test "$(git -C target/ci/control-plane rev-parse HEAD)" = "$DELIVERY_HELPER_REVISION"
          cargo metadata --locked --no-deps --format-version 1 | python3 -B -c \
            'import json,os,sys; assert json.load(sys.stdin)["target_directory"] == os.environ["CARGO_TARGET_DIR"]'

      - name: Build fastp dependencies on Ubuntu
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libdeflate-dev libisal-dev make ninja-build pkg-config
          cmake -S target/ci/highway -B "$RUNNER_TEMP/highway-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DHWY_ENABLE_TESTS=OFF \
            -DHWY_ENABLE_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/highway-build"
          sudo cmake --install "$RUNNER_TEMP/highway-build"

      - name: Install fastp build dependencies on macOS
        if: startsWith(matrix.runner, 'macos')
        run: brew install highway isa-l libdeflate

      - name: Build exact fastp oracle
        run: |
          test "$(git -C target/ci/fastp rev-parse HEAD)" = 23d6211d4f05d61f561899f1b7702435a4b5d408
          make -C target/ci/fastp -j2
          test "$(target/ci/fastp/fastp --version 2>&1)" = "fastp 1.3.6"
          echo "$PWD/target/ci/fastp" >> "$GITHUB_PATH"

      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked --all-features
        env:
          RSOMICS_REQUIRE_FASTP: "1"
      - name: Test release
        shell: bash
        run: |
          if cargo test --release --locked --all-features > "$RUNNER_TEMP/delivery/release-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/delivery/release-tests.log"
          else
            cat "$RUNNER_TEMP/delivery/release-tests.log"
            tail -n 100 "$RUNNER_TEMP/delivery/release-tests.log" | python3 -B -c \
              'import sys; text = sys.stdin.read()[-16000:]; print("::error title=Release tests failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
        env:
          RSOMICS_REQUIRE_FASTP: "1"
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo bench --locked --bench pipeline -- --test

      - name: Package and verify exact source
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/delivery"
          cargo package --locked > "$delivery/package.stdout" 2> "$delivery/package.stderr" || {
            cat "$delivery/package.stdout" "$delivery/package.stderr"
            exit 1
          }
          extracted=$(python3 -B target/ci/control-plane/scripts/native_delivery.py source \
            --repo "$GITHUB_WORKSPACE" --head "$GITHUB_SHA" --host "$EXPECTED_HOST" --out "$delivery")
          printf 'PACKAGE_DIRECTORY=%s\n' "$extracted" >> "$GITHUB_ENV"

      - name: Install verified source and check installed CLI
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/delivery"
          cargo install --locked --offline --path "$PACKAGE_DIRECTORY" --root "$RUNNER_TEMP/installed" \
            > "$delivery/install.stdout" 2> "$delivery/install.stderr" || {
              cat "$delivery/install.stdout" "$delivery/install.stderr"
              exit 1
            }
          python3 -B "$PACKAGE_DIRECTORY/scripts/verify_install.py" \
            --binary "$RUNNER_TEMP/installed/bin/rsomics-fastq-preprocess" \
            --oracle "$GITHUB_WORKSPACE/target/ci/fastp/fastp" --delivery "$delivery"

      - name: Assemble native delivery candidate
        run: |
          python3 -B target/ci/control-plane/scripts/native_delivery.py bundle \
            --out "$RUNNER_TEMP/delivery" --binary "$RUNNER_TEMP/installed/bin/rsomics-fastq-preprocess"

      - name: Retain source, installed evidence and carrier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsomics-fastq-preprocess-delivery-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/delivery/*.crate
            ${{ runner.temp }}/delivery/*.tar.gz
            ${{ runner.temp }}/delivery/SOURCE.json
            ${{ runner.temp }}/delivery/SHA256SUMS
            ${{ runner.temp }}/delivery/dependency-licenses/INDEX.json
            ${{ runner.temp }}/delivery/lifecycle/
            ${{ runner.temp }}/delivery/package.std*
            ${{ runner.temp }}/delivery/install.std*
            ${{ runner.temp }}/delivery/release-tests.log
          if-no-files-found: error
          retention-days: 90
