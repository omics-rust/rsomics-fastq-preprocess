name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DELIVERY_HELPER_REVISION: 46f68f15c2d0e83a71979cc5f51d105d3ddb6c01
  CARGO_BUILD_JOBS: "2"
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
            arch: aarch64
          - target: macos-x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
            arch: x86_64
          - target: macos-aarch64
            runner: macos-15
            host: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_HOST: ${{ matrix.host }}
      EXPECTED_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-world
          ref: ${{ env.DELIVERY_HELPER_REVISION }}
          path: target/ci/control-plane
          sparse-checkout: scripts/native_delivery.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: OpenGene/fastp
          ref: 23d6211d4f05d61f561899f1b7702435a4b5d408
          path: target/ci/fastp
          persist-credentials: false
      - uses: actions/checkout@v6
        if: startsWith(matrix.runner, 'ubuntu')
        with:
          repository: google/highway
          ref: ac0d5d297b13ab1b89f48484fc7911082d76a93f
          path: target/ci/highway
          persist-credentials: false

      - name: Prepare runner storage
        run: |
          set -euo pipefail
          for entry in CARGO_HOME=cargo-home CARGO_TARGET_DIR=cargo-target RUSTUP_HOME=rustup-home TMPDIR=scratch XDG_CACHE_HOME=cache; do
            directory="$RUNNER_TEMP/${entry#*=}"
            mkdir -p "$directory"
            printf '%s=%s\n' "${entry%%=*}" "$directory" >> "$GITHUB_ENV"
          done
          mkdir -p "$RUNNER_TEMP/delivery"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - name: Verify native host and resolved Cargo target
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          test "$(git -C target/ci/control-plane rev-parse HEAD)" = "$DELIVERY_HELPER_REVISION"
          cargo metadata --locked --no-deps --format-version 1 | python3 -B -c \
            'import json,os,sys; assert json.load(sys.stdin)["target_directory"] == os.environ["CARGO_TARGET_DIR"]'

      - name: Build fastp dependencies on Ubuntu
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libdeflate-dev libisal-dev make ninja-build pkg-config
          cmake -S target/ci/highway -B "$RUNNER_TEMP/highway-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DHWY_ENABLE_TESTS=OFF \
            -DHWY_ENABLE_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/highway-build"
          sudo cmake --install "$RUNNER_TEMP/highway-build"

      - name: Install fastp build dependencies on macOS
        if: startsWith(matrix.runner, 'macos')
        run: brew install highway isa-l libdeflate

      - name: Build exact fastp oracle
        run: |
          test "$(git -C target/ci/fastp rev-parse HEAD)" = 23d6211d4f05d61f561899f1b7702435a4b5d408
          make -C target/ci/fastp -j2
          test "$(target/ci/fastp/fastp --version 2>&1)" = "fastp 1.3.6"
          echo "$PWD/target/ci/fastp" >> "$GITHUB_PATH"

      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked --all-features
        env:
          RSOMICS_REQUIRE_FASTP: "1"
      - name: Test release
        shell: bash
        run: |
          if cargo test --release --locked --all-features > "$RUNNER_TEMP/delivery/release-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/delivery/release-tests.log"
          else
            cat "$RUNNER_TEMP/delivery/release-tests.log"
            tail -n 100 "$RUNNER_TEMP/delivery/release-tests.log" | python3 -B -c \
              'import sys; text = sys.stdin.read()[-16000:]; print("::error title=Release tests failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
        env:
          RSOMICS_REQUIRE_FASTP: "1"
      - if: matrix.runner == 'ubuntu-24.04'
        run: cargo bench --locked --bench pipeline -- --test

      - name: Package and verify exact source
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/delivery"
          cargo package --locked > "$delivery/package.stdout" 2> "$delivery/package.stderr" || {
            cat "$delivery/package.stdout" "$delivery/package.stderr"
            exit 1
          }
          extracted=$(python3 -B target/ci/control-plane/scripts/native_delivery.py source \
            --repo "$GITHUB_WORKSPACE" --head "$GITHUB_SHA" --host "$EXPECTED_HOST" --out "$delivery")
          printf 'PACKAGE_DIRECTORY=%s\n' "$extracted" >> "$GITHUB_ENV"

      - name: Install verified source and check installed CLI
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/delivery"
          cargo install --locked --offline --path "$PACKAGE_DIRECTORY" --root "$RUNNER_TEMP/installed" \
            > "$delivery/install.stdout" 2> "$delivery/install.stderr" || {
              cat "$delivery/install.stdout" "$delivery/install.stderr"
              exit 1
            }
          python3 -B "$PACKAGE_DIRECTORY/scripts/verify_install.py" \
            --binary "$RUNNER_TEMP/installed/bin/rsomics-fastq-preprocess" \
            --oracle "$GITHUB_WORKSPACE/target/ci/fastp/fastp" --delivery "$delivery"

      - name: Assemble native delivery candidate
        run: |
          python3 -B target/ci/control-plane/scripts/native_delivery.py bundle \
            --out "$RUNNER_TEMP/delivery" --binary "$RUNNER_TEMP/installed/bin/rsomics-fastq-preprocess"

      - name: Retain source, installed evidence and carrier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsomics-fastq-preprocess-delivery-${{ matrix.target }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/delivery/*.crate
            ${{ runner.temp }}/delivery/*.tar.gz
            ${{ runner.temp }}/delivery/SOURCE.json
            ${{ runner.temp }}/delivery/SHA256SUMS
            ${{ runner.temp }}/delivery/dependency-licenses/INDEX.json
            ${{ runner.temp }}/delivery/lifecycle/
            ${{ runner.temp }}/delivery/package.std*
            ${{ runner.temp }}/delivery/install.std*
            ${{ runner.temp }}/delivery/release-tests.log
          if-no-files-found: error
          retention-days: 90

  audit-originals:
    name: Verify original delivery artifacts
    needs: native
    if: >-
      github.repository == 'omics-rust/rsomics-fastq-preprocess' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/tags/v0.2.0' && github.event.created && !github.event.deleted))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      stage_sha256: ${{ steps.stage.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-world
          ref: ${{ env.DELIVERY_HELPER_REVISION }}
          path: target/ci/control-plane
          sparse-checkout: |
            scripts/native_delivery.py
            scripts/audit_native_delivery.py
            scripts/stage_native_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test the draft publication gate
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B -m unittest discover -s scripts -p test_publish_release.py -v
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Recheck uploaded ZIPs against the exact source and native install receipts
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          errors="$RUNNER_TEMP/native-audit.stderr"
          if ! python3 -B target/ci/control-plane/scripts/audit_native_delivery.py \
            --repo "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/native-audit" 2> "$errors" | tee -a "$GITHUB_STEP_SUMMARY"; then
            python3 -B -c 'import os,sys; from pathlib import Path; text=Path(sys.argv[1]).read_text(errors="replace"); text=text.replace(os.environ["ARTIFACT_TOKEN"], "[masked]")[-4000:]; print("::error title=Original delivery audit failed::" + text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$errors"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rsomics-fastq-preprocess-native-audit-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-audit/AUDITED.json
          if-no-files-found: error
          retention-days: 90
      - name: Stage verified release files
        id: stage
        run: |
          set -euo pipefail
          test "$(git -C target/ci/control-plane rev-parse HEAD)" = "$DELIVERY_HELPER_REVISION"
          staged="$RUNNER_TEMP/release-stage"
          receipt=$(python3 -B target/ci/control-plane/scripts/stage_native_release.py \
            --audit "$RUNNER_TEMP/native-audit" --out "$staged")
          (cd "$staged" && sha256sum --check --strict SHA256SUMS)
          [[ "$receipt" =~ ^[0-9a-f]{64}$ ]]
          printf 'receipt_sha256=%s\n' "$receipt" >> "$GITHUB_OUTPUT"
          printf 'Staged release receipt SHA-256: `%s`\n' "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rsomics-fastq-preprocess-release-stage-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-stage/
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish verified GitHub release
    needs: audit-originals
    if: >-
      github.repository == 'omics-rust/rsomics-fastq-preprocess' && github.event_name == 'push' &&
      github.ref == 'refs/tags/v0.2.0' && github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: fastq-github-release-v0.2.0
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/publish_release.py
            .github/release-v0.2.0.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: rsomics-fastq-preprocess-release-stage-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-stage
      - name: Verify draft assets and publish by release ID
        env:
          RELEASE_STAGE_SHA256: ${{ needs.audit-originals.outputs.stage_sha256 }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B scripts/publish_release.py "$RUNNER_TEMP/release-stage" .github/release-v0.2.0.md
